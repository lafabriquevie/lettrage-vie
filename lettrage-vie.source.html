<title>Lettrage Vié</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : poste de contrôle à trois colonnes : calques | plan de travail | propriétés.
   Thème sombre unique, assumé : c'est un outil d'atelier. */
:root {
  --bg: #0a0f14;
  --panel: #0f161d;
  --panel-2: #131c25;
  --fg: #d6e2ea;
  --muted: #7d909f;
  --line: #1e2a35;
  --line-2: #2a3a48;
  --accent: #3fcfe0;
  --accent-dim: #3fcfe022;
  --stage: #070b0f;
  --danger: #ff6b7a;
  --font-display: "Chakra Petch", "Eurostile", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 13px; line-height: 1.45; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app {
  display: grid; height: 100%; gap: 10px;
  grid-template-columns: 220px minmax(0, 1fr) 320px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "layers stage props";
  padding-block: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
/* Barre du haut */
.topbar {
  grid-area: top; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; border-left: 3px solid var(--accent);
}
.brand { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.brand span { color: var(--accent); }
.proj-name { flex: 1 1 160px; min-width: 120px; max-width: 280px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
/* Panneaux */
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; overflow: hidden; }
.panel > h2 {
  margin: 0; padding: 9px 12px; font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
  border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.panel > h2 small { font-family: var(--font-mono); color: var(--muted); letter-spacing: .06em; font-size: 10px; text-transform: none; }
.panel-body { overflow: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.layers { grid-area: layers; }
.props { grid-area: props; }
/* Calques */
.add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.layer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.layer {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 7px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); cursor: pointer;
}
.layer:hover { border-color: var(--line-2); }
.layer[aria-selected="true"] { border-color: var(--accent); background: #3fcfe012; }
.layer .sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #ffffff33; }
.layer .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .nm small { display: block; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: .04em; }
.layer .acts { display: flex; gap: 2px; }
.layer.off .nm { opacity: .45; }
.ico { border: 0; background: transparent; color: var(--muted); padding: 3px 5px; border-radius: 2px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; line-height: 1; }
.ico:hover:not(:disabled) { color: var(--accent); background: var(--accent-dim); }
.ico:disabled { opacity: .3; cursor: default; }
.ico.danger:hover:not(:disabled) { color: var(--danger); background: #ff6b7a1a; }
.hint { font-size: 11px; color: var(--muted); margin: 0; line-height: 1.5; }
.kbd { font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--line-2); border-radius: 2px; padding: 0 4px; color: var(--fg); }
/* Plan de travail */
.stage {
  grid-area: stage; position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, #0f1a22 0%, var(--stage) 70%);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#plan { cursor: default; }
#plan.grab { cursor: grab; }
#plan.move { cursor: move; }
.stage-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; flex-wrap: wrap; }
.stage-top > * { pointer-events: auto; }
.tabs { display: inline-flex; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; background: #0a0f14cc; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.tabs button + button { border-left: 1px solid var(--line-2); }
.tabs button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
.zoom { display: inline-flex; gap: 4px; }
.status { position: absolute; top: 48px; left: 12px; right: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); pointer-events: none; }
.status.err { color: var(--danger); }
.hud { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.hud > * { pointer-events: auto; }
.dims { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--font-mono); font-variant-numeric: tabular-nums; pointer-events: none; }
.dims .m { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px; border: 1px solid var(--line-2); background: #0a0f14cc; border-radius: 2px; min-width: 70px; }
.dims .m i { font-style: normal; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dims .m b { color: var(--fg); font-weight: 500; font-size: 12px; }
.dims .m b small { color: var(--muted); font-size: 10px; margin-left: 2px; }
/* Boutons */
.btn { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; border-radius: 2px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line-2); background: #0a0f14cc; color: var(--fg); white-space: nowrap; }
.btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: #041015; border-color: var(--accent); box-shadow: 0 0 18px #3fcfe044; }
.btn.primary:hover:not(:disabled) { color: #041015; box-shadow: 0 0 24px #3fcfe088; }
.btn.add { background: transparent; color: var(--accent); border: 1px dashed #3fcfe066; padding: 8px 6px; }
.btn.add.wide { grid-column: span 2; }
.shapebtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--fg); border-radius: 3px; padding: 6px 9px; cursor: pointer; font: inherit; }
.shapebtn svg { width: 34px; height: 34px; fill: var(--fg); flex: none; }
.shapebtn:hover { border-color: var(--accent); }
.picker-back { position: fixed; inset: 0; z-index: 60; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; }
.picker { background: var(--panel); border: 1px solid var(--accent); border-radius: 4px; width: min(680px, 100%); max-height: 86vh; overflow: auto; padding: 14px 16px 18px; box-shadow: 0 20px 60px #000c; }
.picker header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
.picker header b { font-family: var(--font-display); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--accent); }
.picker h4 { margin: 14px 0 6px; font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.picker .grid button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 3px; color: var(--fg); cursor: pointer; font: inherit; font-size: 11px; line-height: 1.2; text-align: center; }
.picker .grid svg { width: 46px; height: 46px; fill: var(--fg); }
.picker .grid button:hover, .picker .grid button:focus-visible, .picker .grid button[aria-selected="true"] { border-color: var(--accent); background: var(--accent-dim); }
.picker .grid.models { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.picker .grid.models button { padding: 12px 10px; gap: 10px; }
.picker .grid.models svg { width: 100%; height: 110px; color: var(--muted); }
.picker .grid.models b { display: block; font-size: 13px; }
.picker .grid.models small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.picker .grid .imp { justify-content: center; color: var(--accent); border-style: dashed; font-size: 12px; }
.btn.sm { padding: 6px 9px; font-size: 10.5px; }
/* Champs */
.group { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; padding-bottom: 0; }
.group > h3 { margin: 0; font-family: var(--font-display); font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 11px; color: var(--muted); }
input[type="text"], input[type="number"], select {
  width: 100%; font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 6px 8px;
}
input[type="number"] { font-family: var(--font-mono); font-size: 12px; padding: 4px 6px; text-align: right; }
input[type="text"].big { font-size: 15px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-dim); }
.num { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; align-items: center; }
.num .u { position: relative; }
.num .u::after { content: attr(data-u); position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 10px; color: var(--muted); pointer-events: none; }
.num .u input { padding-right: 24px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line-2); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--line-2); }
input[type="range"]::-moz-range-progress { height: 2px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 14px; margin-top: -6px; background: var(--accent); border: 0; border-radius: 1px; box-shadow: 0 0 0 3px #3fcfe01f, 0 0 10px #3fcfe066; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 14px; background: var(--accent); border: 0; border-radius: 1px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; align-self: flex-start; flex-wrap: wrap; }
.seg button { font-family: var(--font-mono); font-size: 11px; border: 0; background: var(--panel-2); color: var(--muted); padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
.fil { display: flex; gap: 6px; }
.fil button { width: 34px; height: 30px; border-radius: 3px; border: 1px solid var(--line-2); cursor: pointer; position: relative; font-family: var(--font-mono); font-size: 10px; color: #000a; font-weight: 600; }
.fil button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.colors label { display: flex; flex-direction: column; gap: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-align: center; }
input[type="color"] { width: 100%; height: 32px; border: 1px solid var(--line-2); border-radius: 3px; background: var(--panel-2); padding: 3px; cursor: pointer; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 12px; }
.switch input { appearance: none; -webkit-appearance: none; width: 30px; height: 16px; border-radius: 8px; background: var(--line-2); position: relative; margin: 0; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch input:checked { background: #3fcfe055; }
.switch input:checked::after { transform: translateX(14px); background: var(--accent); box-shadow: 0 0 8px var(--accent); }
/* Sélecteur de police */
.fontpick { position: relative; }
.fontpick > button { width: 100%; text-align: left; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 3px; padding: 6px 28px 6px 9px; cursor: pointer; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fontpick > button::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.fontlist { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); max-height: 300px; overflow: auto; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 3px; padding: 4px; box-shadow: 0 12px 30px #000a; }
.fontlist button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 2px; cursor: pointer; font-size: 17px; }
.fontlist button small { font-family: var(--font-mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.fontlist button:hover, .fontlist button[aria-selected="true"] { background: var(--accent-dim); }
.fontlist h4 { margin: 6px 8px 2px; font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 1000px) {
  .app { grid-template-columns: 200px minmax(0, 1fr); grid-template-areas: "top top" "layers stage" "props props"; grid-template-rows: auto minmax(420px, 1fr) auto; height: auto; min-height: 100%; }
}
@media (max-width: 680px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage" "layers" "props"; grid-template-rows: auto 420px auto auto; }
  .tools .btn { padding: 7px 8px; }
}
@media (prefers-reduced-motion: reduce) { .switch input::after { transition: none; } }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">Lettrage <span>Vié</span></div>
    <input type="text" class="proj-name" id="proj-name" aria-label="Nom du projet" maxlength="60">
    <div class="tools">
      <button type="button" class="btn sm" id="btn-undo" title="Annuler (Ctrl+Z)">Annuler</button>
      <button type="button" class="btn sm" id="btn-redo" title="Rétablir (Ctrl+Maj+Z)">Rétablir</button>
      <button type="button" class="btn sm" id="btn-new">Nouveau</button>
      <button type="button" class="btn sm" id="btn-open">Ouvrir</button>
      <button type="button" class="btn sm" id="btn-save">Enregistrer</button>
      <button type="button" class="btn primary" id="btn-export">Exporter 3MF + STL</button>
      <input type="file" id="file-open" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="panel layers" aria-label="Calques">
    <h2>Calques <small id="layer-count"></small></h2>
    <div class="panel-body">
      <div class="add-row">
        <button type="button" class="btn add" id="add-texte">+ Texte</button>
        <button type="button" class="btn add" id="add-fond">+ Lettre de fond</button>
        <button type="button" class="btn add wide" id="add-forme">+ Forme, icône ou SVG</button>
      </div>
      <input type="file" id="file-svg" accept=".svg,image/svg+xml" hidden>
      <ul class="layer-list" id="layer-list" role="listbox" aria-label="Éléments du projet"></ul>
      <p class="hint">Clique un élément sur le plan pour le sélectionner. Glisse pour le déplacer, la poignée ronde le tourne, la poignée carrée l'agrandit. <span class="kbd">Maj</span> aimante la rotation par 15°.</p>
      <p class="hint"><span class="kbd">Suppr</span> supprime, <span class="kbd">Ctrl D</span> duplique, les flèches déplacent de 1 mm (10 mm avec <span class="kbd">Maj</span>).</p>
    </div>
  </section>

  <main class="stage" id="stage">
    <canvas id="plan" aria-label="Plan de travail vu de dessus"></canvas>
    <canvas id="view3d" aria-label="Aperçu 3D" hidden></canvas>
    <div class="stage-top">
      <div class="tabs" role="group" aria-label="Vue">
        <button type="button" id="tab-plan" aria-pressed="true">Plan</button>
        <button type="button" id="tab-3d" aria-pressed="false">3D</button>
      </div>
      <div class="zoom" id="zoom-plan">
        <button type="button" class="btn sm" id="z-out" aria-label="Dézoomer">−</button>
        <button type="button" class="btn sm" id="z-fit">Ajuster</button>
        <button type="button" class="btn sm" id="z-in" aria-label="Zoomer">+</button>
      </div>
      <div class="zoom" id="zoom-3d" hidden>
        <div class="tabs" role="group" aria-label="Disposition" id="lay3d" hidden>
          <button type="button" id="v-monte" aria-pressed="true" title="Pièces séparées à leur place de montage">Monté</button>
          <button type="button" id="v-print" aria-pressed="false" title="Pièces séparées posées à plat à côté, comme dans le 3MF">Impression</button>
        </div>
        <button type="button" class="btn sm" id="v-face">Face</button>
        <button type="button" class="btn sm" id="v-back">Arrière</button>
      </div>
    </div>
    <div class="status" id="status" role="status"></div>
    <div class="hud"><div class="dims" id="dims"></div></div>
  </main>

  <section class="panel props" aria-label="Propriétés">
    <h2 id="props-title">Projet</h2>
    <div class="panel-body" id="props-body"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>
(() => {
  "use strict";
  const S = 1000; // Clipper travaille en entiers : 1 mm = 1000 unités
  const CL = ClipperLib;
  const STORE_KEY = "lettrage-vie-projet";
  const PLATE = 256;

  // ---------- Polices ----------
  const FONTS = {};
  const FONT_LIST = [];
  function b64ToBuffer(b64) {
    const bin = atob(b64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return buf.buffer;
  }
  for (const f of FONT_DATA) {
    const buf = b64ToBuffer(f.data);
    FONTS[f.cle] = opentype.parse(buf);
    FONT_LIST.push({ cle: f.cle, nom: f.nom, famille: f.famille, graisse: f.graisse, cursive: f.cursive, css: "LV " + f.cle.replace("|", " ") });
    // Aperçu des polices dans le sélecteur ; sans effet si le navigateur refuse
    try { const ff = new FontFace("LV " + f.cle.replace("|", " "), buf.slice(0)); ff.load().then(x => document.fonts.add(x)).catch(() => {}); } catch (e) { /* ignoré */ }
  }
  const fontOf = cle => FONTS[cle] || FONTS["Pacifico|400"] || Object.values(FONTS)[0];
  const fontInfo = cle => FONT_LIST.find(f => f.cle === cle) || FONT_LIST[0];

  // ---------- Géométrie 2D (Clipper) ----------
  const NZ = CL.PolyFillType.pftNonZero;
  function clip(type, a, b) {
    const c = new CL.Clipper();
    c.AddPaths(a, CL.PolyType.ptSubject, true);
    if (b && b.length) c.AddPaths(b, CL.PolyType.ptClip, true);
    const out = new CL.Paths();
    c.Execute(type, out, NZ, NZ);
    return out;
  }
